name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build binary
        run: bun run build
      - name: Test (unit + daemon integration + compiled binary)
        run: bun test
      - name: Shell scripts parse
        run: sh -n scripts/install.sh && sh -n scripts/package.sh && sh -n menubar/build.sh
      - name: Build menu bar app
        run: menubar/build.sh --out "$RUNNER_TEMP"
