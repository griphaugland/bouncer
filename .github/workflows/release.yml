name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts

      # v1.2.3 is a release; v1.2.3-rc.1 (any suffix) is a pre-release of the same version, used
      # to rehearse signing, notarization and the tap push without touching what users install.
      - name: Tag matches package.json
        run: |
          pkg="v$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json | head -1)"
          [ "$pkg" = "${GITHUB_REF_NAME%%-*}" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }
          case "$GITHUB_REF_NAME" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac

      - name: Check
        run: bun run typecheck && bun run lint && bun run build && bun test

      # Signing turns on when these repository secrets exist; without them the release is
      # ad-hoc signed (fine for the curl/gh installer, which doesn't set the quarantine flag).
      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          echo "BOUNCER_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package.sh

      - name: Render Homebrew formula and cask
        env:
          BOUNCER_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          scripts/homebrew.sh dist/release dist/homebrew-tap
          cp dist/homebrew-tap/Formula/bouncer.rb dist/release/homebrew-formula-bouncer.rb
          cp dist/homebrew-tap/Casks/bouncer-app.rb dist/release/homebrew-cask-bouncer-app.rb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          flags=(); [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/release/* "${flags[@]}" --title "Bouncer $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"

      # Needs a fine-grained token with contents:write on griphaugland/homebrew-tap. The cask only
      # ships from signed releases: Homebrew quarantines cask downloads, and macOS blocks an
      # unsigned, quarantined app on launch.
      - name: Update Homebrew tap
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/griphaugland/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula" "$RUNNER_TEMP/tap/Casks"
          cp dist/homebrew-tap/Formula/bouncer.rb "$RUNNER_TEMP/tap/Formula/"
          if [ "$HAS_SIGNING" = "true" ]; then
            cp dist/homebrew-tap/Casks/bouncer-app.rb "$RUNNER_TEMP/tap/Casks/"
            cp dist/homebrew-tap/cask_renames.json "$RUNNER_TEMP/tap/"
            rm -f "$RUNNER_TEMP/tap/Casks/bouncer.rb"  # renamed to bouncer-app in 0.5.1
          fi
          cd "$RUNNER_TEMP/tap"
          git config user.name "bouncer-release"
          git config user.email "bouncer-release@users.noreply.github.com"
          git add -A
          git commit -m "bouncer ${GITHUB_REF_NAME#v}" || { echo "tap already up to date"; exit 0; }
          # Pre-releases go to their own tap branch (rc/<tag>): brew users only ever read main.
          if [ "$PRERELEASE" = "true" ]; then git push origin "HEAD:refs/heads/rc/$GITHUB_REF_NAME"; else git push; fi
    # Only a yes/no reaches every step; the certificate itself stays in the one step that imports it,
    # so dependency install scripts can never read it.
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERT_P12 != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
